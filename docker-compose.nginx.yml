services:
  embytoalist:
    image: ghcr.io/zsbai/embytoalist:latest
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8096:8096"
    depends_on:
      - embytoalist
    restart: unless-stopped
